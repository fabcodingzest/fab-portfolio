# Netlify detects Next.js and runs the contact API route as a function.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's build cache can hold a copy of build-time env values. It stays on the
  # build machine and is never served, so skip only the cache; everything else is scanned.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
